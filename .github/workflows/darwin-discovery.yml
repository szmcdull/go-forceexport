name: Darwin moduledata discovery

on:
  push:
    branches:
      - dev
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: ${{ matrix.arch }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            go: '1.23'
          - runner: macos-14
            arch: arm64
            go: '1.26'
          - runner: macos-14
            arch: arm64
            go: '1.27'
          - runner: macos-15-intel
            arch: amd64
            go: '1.23'
          - runner: macos-15-intel
            arch: amd64
            go: '1.26'
          - runner: macos-15-intel
            arch: amd64
            go: '1.27'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Show environment
        run: |
          go version
          uname -a

      - name: Run Darwin discovery tests
        run: go test -v -count=1 -run 'Test(FindModuleDataInMachOImage|ParseMachO64|LoadedMachOImageRanges)' .

      # Go 1.26+ checkptr is on under -race. The Mach-O scan and init-time
      # GetFunc must not fatal; this is not a data-race test.
      - name: Race discovery
        run: CGO_ENABLED=1 go test -race -count=1 -skip '^TestContext$' ./...

      - name: Test discovery beyond 32 MiB
        run: go test -v -count=1 -tags=large_discovery_test -run '^TestLargeDarwinModuleDataDiscovery$' .

      - name: Test function lookup and runtime layout
        run: go test -count=1 -gcflags="all=-N -l" ./...

      - name: Test optimized function lookup and runtime layout
        run: go test -count=1 -skip '^TestContext$' ./...

      - name: Test optimized linkname lookup and runtime layout
        run: go test -count=1 -skip '^TestContext$' -tags=checklinkname_off -ldflags=-checklinkname=0 ./...

      - name: Test linkname lookup and runtime layout
        run: go test -count=1 -gcflags="all=-N -l" -tags=checklinkname_off -ldflags=-checklinkname=0 ./...
